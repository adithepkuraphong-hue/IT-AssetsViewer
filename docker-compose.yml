services:
  asset-control:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asset-control-app
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      - ASSET_CONTROL_PORT=8788
      - ASSET_CONTROL_HOST=0.0.0.0
      # You can override Supabase settings here if needed
      # - SUPABASE_URL=https://tzmiavpdslpmpzowabxa.supabase.co
      # - SUPABASE_ANON_KEY=your_supabase_key
      # - ASSET_CONTROL_API_TOKEN=your_api_token
    volumes:
      - ./outputs:/app/outputs
      - ./work:/app/work
